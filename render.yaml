services:
  - type: web
    name: procucev-speech-to-text
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-transcribe-live
      - key: DATABASE_URL
        fromDatabase:
          name: speech-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
databases:
  - name: speech-db
    plan: free
